name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check index.js
      - name: Unit tests (pure functions)
        run: node test.mjs
      - name: Host lifecycle fixture (mock host)
        run: node test-host.mjs
      - name: Retrieval eval (synthetic fixture, no personal data)
        run: node eval.mjs --fixture
      # Real evaluation data is local only (eval-queries.local.json, gitignored):
      #   node eval.mjs            # uses local queries if present
      #   node eval.mjs --fixture  # synthetic
