name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check index.js
      - name: Unit tests (pure functions)
        run: node test.mjs
      # eval.mjs / bench.mjs need a real memory store under $DSH_HOME and are run locally:
      #   node eval.mjs [--dir <exchanges dir>]
